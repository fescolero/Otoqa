# TEMPORARY — verifies Actions repository secrets are visible to workflows.
# Reports presence only, never values. Deleted after verification.
name: tmp-verify-secrets

on:
  push:
    branches: [claude/error-tracking-evaluation-v4ss21]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_POSTHOG: ${{ secrets.POSTHOG_PERSONAL_API_KEY != '' }}
      HAS_CONVEX: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
      POSTHOG_PREFIX_OK: ${{ startsWith(secrets.POSTHOG_PERSONAL_API_KEY, 'phx_') }}
    steps:
      - name: Report secret presence
        run: |
          echo "ANTHROPIC_API_KEY set:          $HAS_ANTHROPIC"
          echo "POSTHOG_PERSONAL_API_KEY set:   $HAS_POSTHOG"
          echo "POSTHOG key has phx_ prefix:    $POSTHOG_PREFIX_OK"
          echo "CONVEX_DEPLOY_KEY set:          $HAS_CONVEX"
          echo "OPENAI_API_KEY set:             $HAS_OPENAI"
